<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ury Hindu Mandram | யூரி இந்து மன்றம்</title>
<style>
:root{--bg:#fff8e1;--sf:#fff;--tx:#2b1a14;--mu:#7a6358;--mr:#b00000;--md:#7d0000;--gd:#f5c518;--bd:#ecd9a0;--ok:#1b7a3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1110;--sf:#2a1917;--tx:#f6e9d2;--mu:#b9a28f;--mr:#e04a4a;--md:#5a0d0d;--bd:#4a3027;--ok:#5fd085;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1110;--sf:#2a1917;--tx:#f6e9d2;--mu:#b9a28f;--mr:#e04a4a;--md:#5a0d0d;--bd:#4a3027;--ok:#5fd085;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Noto Sans Tamil","Latha",Georgia,"Times New Roman",serif}
header{background:linear-gradient(90deg,#b00000,#7d0000);color:#fff3c4;display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:4px solid var(--gd)}
header img{width:64px;height:64px;border-radius:50%;border:2px solid var(--gd)}
header h1{margin:0;font-size:22px;line-height:1.2}header small{display:block;color:#ffe9a0;font-size:13px}
.wrap{display:flex;min-height:calc(100vh - 90px)}
nav{width:250px;flex:none;background:var(--sf);border-right:1px solid var(--bd);padding:10px}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--tx);padding:8px 10px;border-radius:6px;cursor:pointer;font:inherit}
nav button:hover{background:var(--bd)}nav button.on{background:var(--mr);color:#fff}
nav .sec{font-weight:bold;color:var(--mr);margin:12px 0 2px;padding:0 10px}
main{flex:1;min-width:0;padding:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button,.b{background:var(--sf);border:1px solid var(--mr);color:var(--mr);padding:6px 12px;border-radius:6px;cursor:pointer;font:inherit}
.tabs button.on,.b.p{background:var(--mr);color:#fff}.b.s{padding:2px 8px;font-size:13px;margin:1px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.bar h2{margin:0;flex:1;color:var(--mr)}
input,select,textarea{font:inherit;padding:6px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--sf);color:var(--tx);width:100%}
.bar input{width:200px}
.tw{overflow-x:auto;background:var(--sf);border:1px solid var(--bd);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:7px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{background:var(--md);color:#ffe9a0;position:sticky;top:0}td.n{text-align:right}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.k{background:var(--sf);border:1px solid var(--bd);border-left:5px solid var(--gd);border-radius:8px;padding:10px}.k b{display:block;font-size:24px;color:var(--mr)}.k span{color:var(--mu);font-size:13px}
dialog{max-height:92vh;overflow:auto;border:2px solid var(--gd);border-radius:10px;background:var(--sf);color:var(--tx);max-width:520px;width:92%}
dialog.w{max-width:230mm}.a4{width:210mm;max-width:none;min-height:297mm;background:#fff;color:#000;padding:15mm;margin:8px auto;font:14px/1.6 Georgia,"Noto Sans Tamil",serif;border:1px solid #ccc}.a4 td{white-space:normal}dialog label{display:block;margin:8px 0 2px;font-size:13px;color:var(--mu)}
.empty{padding:20px;color:var(--mu)}.tag{padding:1px 8px;border-radius:10px;background:var(--bd);font-size:12px}
.card{border:3px solid var(--mr);border-radius:12px;padding:12px;text-align:center;background:#fff8e1;color:#2b1a14}.card img{width:60px}
#pr{display:none}
@media print{@page{size:A4;margin:12mm}body>*:not(#pr){display:none!important}#pr{display:block;color:#000;background:#fff;padding:20px}}
@media (max-width:760px){.wrap{display:block}nav{width:auto;display:flex;overflow-x:auto;gap:4px;border:0}nav .sec{display:none}nav button{white-space:nowrap;width:auto}header h1{font-size:17px}}

function viewer(){if(S().vh&&!SS.get('vok')&&!SS.get('ok')){const p=prompt('Enter the view-only password');if(!p||HS('v:'+p)!=S().vh){alert('Wrong password');document.body.innerHTML='<p style="padding:20px">Access denied. Reload to try again.</p>';return}SS.set('vok',1)}
$('#nav').style.display='none';
const draw=()=>{const b=bal(),L=R('ledger'),ti=L.filter(x=>x.type=='Income').reduce((s,x)=>s+num(x.amount),0),te=L.filter(x=>x.type=='Expense').reduce((s,x)=>s+num(x.amount),0),K=(v,l)=>'<div class="k"><b>'+v+'</b><span>'+l+'</span></div>';
$('#main').innerHTML='<div class="bar"><h2>View-only · பார்வை மட்டும்</h2><button class="b" id="vi">Load backup file</button><button class="b" id="vx">Print members</button><a href="#" id="va">Admin login</a></div><div class="g">'+K(M(b.Cash+b.Bank),'Total balance')+K(M(b.Cash),'Cash balance')+K(M(b.Bank),'Bank balance')+K(M(ti),'Total income')+K(M(te),'Total expenses')+K(R('members').length,'Members')+'</div><div id="vs"></div><h3>All members</h3><div class="tw"><table id="mt"><tr><th>ID</th><th>Name</th><th>NIC</th><th>Mobile</th><th>Address</th><th>Type</th><th>Status</th><th>Joined</th><th>Renewal</th><th>Fee</th></tr>'+(R('members').map(m=>'<tr>'+['no','name','nic','phone','address','mtype','status','joined','renew'].map(k=>'<td>'+esc(m[k])+'</td>').join('')+'<td class="n">'+M(m.fee)+'</td></tr>').join('')||'<tr><td colspan=10 class="empty">No members.</td></tr>')+'</table></div><h3>Accounts ledger (latest 100)</h3><div class="tw"><table><tr><th>Date</th><th>No</th><th>Type</th><th>Category</th><th>Description</th><th>Amount</th><th>Mode</th><th>Approval</th></tr>'+(L.slice(-100).reverse().map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+esc(x.no)+'</td><td>'+esc(x.type)+'</td><td>'+esc(x.cat)+'</td><td>'+esc(x.desc)+'</td><td class="n">'+M(x.amount)+'</td><td>'+esc(x.mode)+'</td><td>'+esc(x.status)+'</td></tr>').join('')||'<tr><td colspan=8 class="empty">No entries.</td></tr>')+'</table></div>';
msbox($('#vs'),'afterbegin');$('#va').onclick=e=>{e.preventDefault();location.hash=''};
$('#vx').onclick=()=>pr(head+'<h3 style="text-align:center">Members · '+today()+'</h3>'+$('#mt').outerHTML);
$('#vi').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{const r=new FileReader();r.onload=()=>{try{DB=JSON.parse(r.result);DB._n=DB._n||{};DB._s=DB._s||{};draw()}catch(e){alert('Not a valid backup file.')}};r.readAsText(i.files[0])};i.click()}};draw()}
function boot(){$('#nav').style.display='';if(location.hash=='#view')return viewer();if(!S().adm)return setup();if(!SS.get('ok'))return login();window.ADM=SS.get('ok');go()}
onhashchange=()=>location.reload();
boot();
</script></body></html>
